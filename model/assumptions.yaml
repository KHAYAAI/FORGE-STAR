# FORGE STAR financial model — assumptions (Stages 0–3, years 1–6)
# All figures USD, illustrative. Edit here, then run: python3 model/financial_model.py
# Year 1 = Stage 0 (ground first). Satellites launch per the schedule below.

fx_zar_per_usd: 18.0
years: [1, 2, 3, 4, 5, 6]

scenarios:
  # Multipliers applied to the base case. low = slower sales, higher costs.
  low:  {revenue: 0.6, capex: 1.25, opex: 1.1}
  base: {revenue: 1.0, capex: 1.0,  opex: 1.0}
  high: {revenue: 1.3, capex: 0.85, opex: 0.95}

constellation:
  # Satellites in service at year end (Stage 1 = 1–2, Stage 2 = 6–12, Stage 3 = 24–48)
  sats_in_service:   [0, 1, 2, 10, 24, 36]
  hosted_payloads:   [0, 1, 0, 0, 0, 0]        # year-2 hosted payload (Stage 1 lean demo)
  hosted_payload_cost: 350000                  # $200–500k range
  sat_unit_cost:     [0, 1800000, 1200000, 700000, 550000, 500000]  # bus+payload+AIT per sat; learning curve
  launch_per_sat:    [0, 250000, 200000, 160000, 140000, 120000]    # $80–250k per 6U–12U slot
  insurance_pct:     0.08                       # of sat+launch cost
  replacement_rate:  [0, 0, 0, 0, 0.1, 0.2]   # share of last year's fleet replaced (3–5 yr life)

ground:
  stations_added:    [1, 2, 2, 3, 2, 1]        # SatNOGS-class first, gateways later
  station_cost:      [60000, 120000, 200000, 350000, 350000, 350000]
  opex_per_station:  25000                      # per year

team:
  headcount:         [5, 10, 18, 30, 50, 65]   # lean-team numbers from strategy section 09
  loaded_cost:       [60000, 70000, 80000, 90000, 95000, 100000]  # SA salaries + benefits, incl. some senior international RF/space hires

other_opex:
  platform_cloud:    [30000, 60000, 120000, 250000, 400000, 550000]   # SA-hosted ThingsBoard/Kafka/TimescaleDB
  spectrum_legal:    [150000, 250000, 350000, 400000, 400000, 400000] # ICASA, ITU, counsel
  sales_marketing_pct_revenue: 0.12
  g_and_a:           [80000, 150000, 300000, 600000, 900000, 1200000]
  cogs_resale_pct:   0.55     # share of IoT-resale revenue paid to the host network
  cogs_leased_pct:   0.70     # share of leased-capacity site revenue paid to capacity provider
  network_cogs_pct:  0.30     # own-network cost of revenue: gateways, TT&C, spectrum fees, device support, data landing

revenue:
  iot:
    # Devices active at year end. Years 1–2 resold on a partner network; own network from year 3.
    devices:         [2000, 10000, 40000, 110000, 220000, 330000]
    arpu_month:      [4.0, 3.8, 3.5, 3.2, 3.0, 2.8]   # $2–5 per device per month
    own_network_from_year: 3
  ais_subscribers:   [0, 1, 2, 3, 4, 5]
  ais_price_year:    [0, 400000, 700000, 1000000, 1200000, 1200000]
  sovereign:
    # SA government capacity contract: signed year 4, part prepaid in year 3/4
    contract_value_year: [0, 0, 0, 8000000, 15000000, 18000000]
    prepayment:          [0, 0, 3000000, 5000000, 0, 0]  # cash in, recognised later (deferred revenue)
  ground_services:   [100000, 300000, 600000, 1000000, 1400000, 1800000]
  managed_sites:     # rural government sites on leased capacity (Stage 0 relationship play)
    sites:           [0, 20, 80, 200, 300, 300]
    price_month:     350
  ecosystem:         [150000, 300000, 500000, 800000, 1000000, 1200000]  # FORGE Freight/USV/VOCAL/ForgePay/EYE

funding:
  founder_and_bootstrap: [250000, 0, 0, 0, 0, 0]
  grants:            [300000, 1000000, 1500000, 1500000, 1000000, 1000000]  # TIA, DSI, SANSA, NEF, IDC, DTIC
  angel_seed:        [0, 2500000, 0, 0, 0, 0]
  series_a:          [0, 0, 22000000, 0, 0, 0]   # $15–30M at Stage 2
  series_b:          [0, 0, 0, 0, 25000000, 0]
  debt_or_dfi:       [0, 0, 0, 0, 0, 0]
