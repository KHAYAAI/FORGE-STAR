# Engineering maturity by subsystem, on the NASA/ESA Technology Readiness Level scale (1–9).
# TRL 4 = validated in a lab/emulated environment; 5 = in a relevant environment; 6 = demo prototype in relevant
# environment; 7 = demo in space; 8 = flight-qualified; 9 = flight-proven. Update as evidence arrives.
# needed_for_launch: TRL required before the hosted-payload / first-satellite launch (Stage 1).
assessed_on: 2026-11-12
subsystems:
  - {name: "Store-and-forward core (flight/libforge, C99)", trl: 4, needed_for_launch: 6,
     evidence: "Byte-identical to ground code; acks; per-record CRC + memory scrubbing; save/load across reboot; onboard pass predictor (matches ground model to 1e-9 km); runs on x86 and aarch64",
     next: "Run on the payload processor dev board; fault injection; size FORGE_SF_CAPACITY for real traffic"}
  - {name: "Flight software (F´ deployment)", trl: 4, needed_for_launch: 6,
     evidence: "Full topology with signed-command authentication, safe mode (ModeManager), persistence, onboard pass predictor; commanded live by ground/ops; CI runs native + ARM",
     next: "Real NB-IoT radio + X-band drivers and bus interface instead of PayloadSim; key storage; long soak test"}
  - {name: "Radio link layer (RS(255,223) CCSDS dual basis, randomiser, ASM)", trl: 4, needed_for_launch: 6,
     evidence: "CCSDS concatenated coding (RS dual basis + K=7 r=1/2 conv, soft Viterbi): decodes at Eb/N0 2.5 dB with Doppler/phase/timing offsets; C encoders byte-identical",
     next: "Over-the-air test with SDR + SatNOGS; interop with a third-party CCSDS decoder"}
  - {name: "NB-IoT NTN payload radio", trl: 2, needed_for_launch: 6,
     evidence: "Link budget; lab test-bed plan (docs/ntn-testbed-plan.md); no hardware yet",
     next: "12-week OAI + Open5GS bench (needs TIA/DSI grant and ICASA test licence)"}
  - {name: "Payload antenna (S-band)", trl: 2, needed_for_launch: 6,
     evidence: "Trade study: patch (37° mask) vs isoflux (16–21°) vs array. Independent review found the patch gain and beamwidth inconsistent, so the masks are optimistic",
     next: "openEMS model of isoflux antenna, then prototype + range measurement"}
  - {name: "Payload interface board (hardware/pib)", trl: 3, needed_for_launch: 6,
     evidence: "Schematic as code (Zener and SKiDL), placed, autorouted in CI with every connection made; 4 layers, 58 x 40 mm; 3D model. Not reviewed or built",
     next: "Engineer review, fab 5 boards, bring-up with libforge"}
  - {name: "IoT test device board (hardware/zener/boards/iot_node)", trl: 2, needed_for_launch: 5,
     evidence: "Schematic as code builds clean; placed on 84 x 45 mm, 4 layers; routing in progress; BC66 footprint (terrestrial NB-IoT), NTN module pin map unconfirmed",
     next: "Finish routing; confirm the CC660D-LS pin map with Quectel; review; fab; run the device SDK on it"}
  - {name: "Device SDK (forge_device, C99)", trl: 4, needed_for_launch: 5,
     evidence: "Queue, re-send until acked, expiry, overflow handling, CRC uplink packets; tested with Python-made ACK frames",
     next: "Port to a Rel-17 NB-IoT NTN module (e.g. on a dev kit); pilot with FORGE Freight trackers"}
  - {name: "Satellite bus", trl: 0, needed_for_launch: 9,
     evidence: "Buy from Dragonfly / CubeSpace (flight-proven products); no contract yet",
     next: "Quotes + MoU; confirm 25–40 W payload power during passes (isoflux antenna)"}
  - {name: "Ground gateway (decode, dedupe, acks, SatNOGS input)", trl: 4, needed_for_launch: 6,
     evidence: "Runs in the platform; IQ demod, FEC decode, duplicate removal, ack uplink; mission ops tool commands the flight software",
     next: "First SatNOGS station on air; decode a real satellite; gateway site lease (Hartebeesthoek)"}
  - {name: "Data platform (Kafka, TimescaleDB, ThingsBoard, customer API)", trl: 5, needed_for_launch: 7,
     evidence: "Full stack runs end to end; live ThingsBoard; API with rate limits, audit log, metrics, key revocation; production overlay with TLS, backups, no exposed data ports",
     next: "Deploy on SA hosting, restore drill, monitoring/alerting, POPIA review"}
  - {name: "Constellation design (orbits, coverage, delivery time)", trl: 4, needed_for_launch: 5,
     evidence: "J2 propagator checked vs SGP4; coverage, latency and equatorial studies; global coverage maps. Results assume a 16° mask that depends on the isoflux antenna and ~38 W, still unproven",
     next: "Orekit cross-check with drag; ITU filing parameters from the chosen design"}
