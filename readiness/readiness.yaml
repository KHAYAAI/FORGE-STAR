# FORGE STAR path to readiness: the outside work that decides when service can start.
# Edit statuses here, then run: python3 readiness/tracker.py   (writes readiness/STATUS.md)
#
# Months are counted from `start`. status: todo | doing | done | blocked
# reverify: true marks regulatory/market facts to confirm with counsel before external use.
# owner "TBD" = not yet assigned.

start: 2026-12-01
today: 2026-11-12     # override when updating; tracker also accepts --today

workstreams:
  spectrum: "Permission to transmit (ICASA + ITU)"
  commercial: "Revenue before satellites"
  ownership: "Ownership and corporate"
  funding: "Funding"
  lab: "Proof in the lab"
  orbit: "Proof in orbit"
  service: "Early service and operations"
  hardware: "Payload hardware and bridging partners"

items:
  # --- Permission to transmit ---
  - {id: S1, ws: spectrum, title: "Brief specialist spectrum counsel; agree bands (S-band MSS/NB-IoT NTN, VHF AIS, X-band feeder)", start: 0, months: 2, owner: TBD, status: todo}
  - {id: S2, ws: spectrum, title: "ICASA pre-application meeting (NGSO IoT/AIS, test licence for lab)", start: 1, months: 2, depends: [S1], owner: TBD, status: todo, reverify: true}
  - {id: S3, ws: spectrum, title: "ICASA test/experimental licence for over-the-air lab work (Regulation 40)", start: 2, months: 4, depends: [S2], owner: TBD, status: todo, reverify: true,
     note: "Lasts at most 3 months and covers at most 100 stations; an extension is a new application. Apply just before over-the-air tests. Cabled lab work is planned to start without it (counsel to confirm)."}
  - {id: S9, ws: spectrum, title: "Operating route until ICASA opens I-ECNS applications: partner with an existing I-ECNS/I-ECS licensee", start: 1, months: 5, depends: [S1], owner: TBD, status: todo, reverify: true,
     note: "ICASA's June 2026 notice: a constellation needs I-ECS, I-ECNS and RFS licences. I-ECNS can only be applied for after an Invitation to Apply. Timing is outside our control."}
  - {id: S4, ws: spectrum, title: "Prepare and lodge NGSO network filing via ICASA to ITU (24–100 sats)", start: 3, months: 6, depends: [S2], owner: TBD, status: todo, reverify: true,
     note: "Filing date starts the ITU clock: bring-into-use within 7 years, then deployment milestones (Res. 35: 10% / 50% / 100%). Re-verify."}
  - {id: S5, ws: spectrum, title: "ITU coordination with affected operators", start: 9, months: 24, depends: [S4], owner: TBD, status: todo, reverify: true}
  - {id: S6, ws: spectrum, title: "ICASA radio frequency spectrum licence + ECNS/ECS licences", start: 6, months: 12, depends: [S2, O2], owner: TBD, status: todo, reverify: true}
  - {id: S7, ws: spectrum, title: "Landing rights in first SADC markets (Namibia, Botswana, Mozambique)", start: 18, months: 12, depends: [S6], owner: TBD, status: todo, reverify: true}
  - {id: S8, ws: spectrum, title: "Bring-into-use: first satellite transmitting under the filing", start: 24, months: 3, depends: [S4, R3], owner: TBD, status: todo, reverify: true}

  # --- Ownership ---
  - {id: O1, ws: ownership, title: "Design cap table for the 30% HDG rule (model/assumptions.yaml ownership)", start: 0, months: 2, owner: TBD, status: doing}
  - {id: O2, ws: ownership, title: "Incorporate FORGE STAR entity; shareholder agreement; HDG verification", start: 1, months: 3, depends: [O1], owner: TBD, status: todo, reverify: true}
  - {id: O3, ws: ownership, title: "HDG anchor investor identified for seed (IDC / NEF / BEE fund)", start: 3, months: 6, depends: [O2], owner: TBD, status: todo}

  # --- Revenue before satellites ---
  - {id: C1, ws: commercial, title: "Ecosystem LOIs: FORGE Freight + maritime USV venture", start: 0, months: 2, owner: TBD, status: todo}
  - {id: C2, ws: commercial, title: "IoT reseller agreement with an existing satellite IoT network", start: 0, months: 4, owner: TBD, status: todo}
  - {id: C3, ws: commercial, title: "First SatNOGS station live (Johannesburg) on ground/ stack", start: 0, months: 2, owner: TBD, status: doing}
  - {id: C4, ws: commercial, title: "First paying customers on resale (ecosystem + 1 mining group)", start: 3, months: 6, depends: [C1, C2, C3], owner: TBD, status: todo}
  - {id: C5, ws: commercial, title: "Fisheries / Navy AIS pilot (DFFE or SA Navy)", start: 4, months: 9, depends: [C3], owner: TBD, status: todo}
  - {id: C6, ws: commercial, title: "Ground-station services contract (foreign operator passes)", start: 4, months: 8, depends: [C3], owner: TBD, status: todo}

  # --- Funding ---
  - {id: F1, ws: funding, title: "TIA/DSI grant application: NB-IoT NTN lab", start: 1, months: 4, owner: TBD, status: todo, reverify: true}
  - {id: F2, ws: funding, title: "Seed round closed (≈$2.5M, HDG anchor) — before year 2 starts", start: 6, months: 5, depends: [O3, C4], owner: TBD, status: todo,
     note: "Model needs the seed by month 12, but waiting for paying customers + an HDG anchor puts the earliest close at ~month 14. Raise on signed LOIs (C1) with the anchor in parallel, or bridge months 12–14 with grants."}
  - {id: F3, ws: funding, title: "Series A ($15–30M) on early-service traction", start: 24, months: 6, depends: [R4], owner: TBD, status: todo}
  - {id: F4, ws: funding, title: "Government capacity contract with prepayment", start: 24, months: 18, depends: [S6, R4], owner: TBD, status: todo}

  # --- Proof in the lab ---
  - {id: L1, ws: lab, title: "Buy lab kit (SDRs, GPSDO, NTN dev kits) — docs/ntn-testbed-plan.md", start: 4, months: 1, depends: [F1], owner: TBD, status: todo}
  - {id: L2, ws: lab, title: "12-week NB-IoT NTN test-bed, cabled (attach, Doppler, link budget, store-and-forward)", start: 5, months: 3, depends: [L1], owner: TBD, status: todo}
  - {id: L4, ws: lab, title: "Fix the antenna and link budget: gain to match beamwidth, coverage on the downlink mask, per-pass capacity", start: 0, months: 2, owner: TBD, status: todo,
     note: "Independent review, Nov 2026: a 14 dBi patch cannot have a 30 degree half-beam; the downlink, not the uplink, sets coverage; no capacity model. Satellite count and capex depend on this."}
  - {id: L3, ws: lab, title: "Antenna decision: patch + deep coverage for demo; isoflux for Stage 2 (sim/antenna_trade.py)", start: 6, months: 2, depends: [L2, L4], owner: TBD, status: todo}

  # --- Proof in orbit ---
  - {id: R1, ws: orbit, title: "Bus partner quotes and MoU (Dragonfly Aerospace / CubeSpace)", start: 1, months: 4, owner: TBD, status: todo}
  - {id: R2, ws: orbit, title: "Hosted-payload slot contracted (~$350k)", start: 8, months: 3, depends: [R1, F2, L3, H7], owner: TBD, status: todo}
  - {id: R3, ws: orbit, title: "Hosted payload built, qualified, launched, commissioned", start: 11, months: 12, depends: [R2], owner: TBD, status: todo}
  - {id: R4, ws: orbit, title: "Own 6U–12U demonstrator launched; store-and-forward in orbit", start: 18, months: 12, depends: [R3, S6], owner: TBD, status: todo}

  # --- Payload hardware and bridging partners (see docs/brief.md and register V1–V7) ---
  - {id: H1, ws: hardware, title: "Payload interface board: engineer review, fab 5, bring up with libforge", start: 0, months: 2, owner: TBD, status: doing,
     note: "Nov 2026: designed in Zener and SKiDL, placed, autorouted in CI with every connection made. Not yet reviewed by an engineer or fabricated."}
  - {id: H8, ws: hardware, title: "IoT test device board: finish routing, confirm NTN module pin map (Quectel CC660D-LS), review, fab", start: 0, months: 3, owner: TBD, status: doing, reverify: true,
     note: "Nov 2026: schematic and placement done, routing in progress. Needed for the lab test-bed and customer trials."}
  - {id: H2, ws: hardware, title: "Hosted-payload RFQ to a host platform (Loft Orbital or D-Orbit) alongside the bus RFQ", start: 1, months: 3, owner: TBD, status: todo, reverify: true}
  - {id: H3, ws: hardware, title: "RF vendor quotes: S-band SDR + PA, X-band transmitter, S-band patch (EnduroSat, Alén, IQ Spacecom)", start: 1, months: 2, owner: TBD, status: todo, reverify: true}
  - {id: H4, ws: hardware, title: "SPENVIS radiation analysis for the 550 km 45°/10° orbits; parts selection", start: 1, months: 1, owner: TBD, status: todo}
  - {id: H5, ws: hardware, title: "iThemba LABS: confirm proton SEE test access; book slot for processor/memory/SDR", start: 4, months: 3, depends: [H3], owner: TBD, status: todo, reverify: true}
  - {id: H6, ws: hardware, title: "Payload processor module chosen; heypcb.ai carrier board", start: 3, months: 2, depends: [H3], owner: TBD, status: todo}
  - {id: H7, ws: hardware, title: "Payload frozen against the bus/host ICD (mass, power, interfaces)", start: 6, months: 2, depends: [R1, H2, H6, L3], owner: TBD, status: todo}

  # --- Early service ---
  - {id: V1, ws: service, title: "6–12 satellites at 45° (Stage 2 early service)", start: 30, months: 12, depends: [F3, S5], owner: TBD, status: todo}
  - {id: V2, ws: service, title: "Mobile operator wholesale agreement", start: 30, months: 12, depends: [V1], owner: TBD, status: todo}

# Plan options: overrides applied on top of the items above. The tracker compares their finish dates.
# Each is cumulative only if it says so (list the earlier overrides again).
scenarios:
  parallel_seed:
    _label: "Seed raise runs alongside the HDG-anchor search"
    F2: {depends: [O2, C4]}
  seed_on_lois:
    _label: "Seed raised on signed LOIs (not paying customers), anchor in parallel"
    F2: {depends: [O2, C1], start: 6}
  parallel_demo:
    _label: "+ own demonstrator built in parallel with the hosted payload"
    F2: {depends: [O2, C4]}
    R4: {depends: [R2, S6], start: 12}
  fast_track:
    _label: "Seed on LOIs + demonstrator in parallel + Series A on the hosted-payload result, tighter builds"
    F2: {depends: [O2, C1], start: 6}
    R4: {depends: [R2, S6], start: 12}
    F3: {depends: [R3]}
    R3: {months: 10}
    V1: {months: 9}
