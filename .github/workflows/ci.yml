name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonts for the PDF
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Coverage simulation (quick run)
        run: DAYS=1 STEP_S=60 python sim/coverage_sim.py > /dev/null
      - name: Financial model
        run: python model/financial_model.py > /dev/null
      - name: Antenna trade, SGP4 check, readiness
        run: python sim/antenna_trade.py > /dev/null && python sim/capacity_study.py > /dev/null && python sim/sgp4_crosscheck.py > /dev/null && python sim/latency_sim.py > /dev/null && python sim/equatorial_study.py > /dev/null && python readiness/tracker.py > /dev/null && python scripts/launch_readiness.py > /dev/null && python scripts/itu_parameters.py > /dev/null
      - name: Verification register
        run: python scripts/verify_register.py > /dev/null
      - name: Strategy PDF and technical/investor brief
        run: |
          python scripts/build_pdf.py
          python scripts/build_pdf.py --src docs/brief.md --out output/FORGE_STAR_Brief.pdf --subtitle "Technical and investor brief" --tagline "Investors  ·  Counsel  ·  Systems & RF  ·  Software  ·  Hardware  ·  Due diligence" --label "Brief v1.2  ·  November 2026  ·  Confidential" --title "FORGE STAR — Technical and Investor Brief"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-star-outputs
          path: |
            output/FORGE_STAR_Strategy.pdf
            output/FORGE_STAR_Brief.pdf
            model/results/
            sim/results/

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: ground
        run: docker compose config -q
      - name: Build service images
        working-directory: ground
        run: docker compose build ingest simulator sandf gateway api
      - name: Validate production overlay
        working-directory: ground
        run: PG_PASSWORD=ci API_DOMAIN=a.example TB_DOMAIN=b.example ACME_EMAIL=ci@example.com docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config -q

  hardware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: KiCad + SKiDL
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          pip install --break-system-packages --no-deps skidl graphviz simp_sexp
      - name: Payload interface board (ERC, placement, DRC, fab files)
        run: |
          if [ "${{ vars.FORGE_AUTOROUTE }}" = "1" ]; then
            curl -sSL -o freerouting.jar https://github.com/freerouting/freerouting/releases/download/v1.9.0/freerouting-1.9.0.jar
            export FREEROUTING_JAR=$PWD/freerouting.jar
          fi
          python3 hardware/boards/pib/pib.py
      - uses: actions/upload-artifact@v4
        with:
          name: pib-fab
          path: hardware/build/pib/

  zener:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pcb (Zener)
        run: |
          curl -fsSL https://raw.githubusercontent.com/diodeinc/pcb/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build boards (checks only; nothing is sent to Diode)
        working-directory: hardware/zener
        run: |
          pcb build boards/pib/pib.zen
          pcb build boards/iot_node/iot_node.zen
          pcb bom --offline boards/iot_node/iot_node.zen

  flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: libforge (C99) tests
        run: |
          cmake -S flight/libforge -B build/libforge
          cmake --build build/libforge
          ctest --test-dir build/libforge --output-on-failure
      - name: F´ tools
        run: pip install -r flight/fprime/fprime/requirements.txt
      - name: StoreForward component unit tests
        working-directory: flight/fprime
        run: |
          fprime-util generate --ut
          fprime-util check -j4
      - name: Payload deployment (native) runs and its downlink decodes on the ground
        run: |
          pip install numpy pyyaml
          (cd flight/fprime && fprime-util generate && fprime-util build -j4)
          python flight/run_payload.py
          python flight/run_payload.py --predictor --seconds 15
      - name: Mission ops against the flight binary (signed commands, safe mode, persistence)
        run: |
          pip install pytest cryptography
          python -m pytest -q tests/test_flight_ops.py
      - name: Payload deployment on 64-bit ARM (cross-compiled, run under QEMU)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
          (cd flight/fprime && fprime-util generate aarch64-linux && fprime-util build aarch64-linux -j4)
          python flight/run_payload.py --arch aarch64 --seconds 8
