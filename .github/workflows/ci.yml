name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonts for the PDF
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Coverage simulation (quick run)
        run: DAYS=1 STEP_S=60 python sim/coverage_sim.py > /dev/null
      - name: Financial model
        run: python model/financial_model.py > /dev/null
      - name: Antenna trade, SGP4 check, readiness
        run: python sim/antenna_trade.py > /dev/null && python sim/sgp4_crosscheck.py > /dev/null && python readiness/tracker.py > /dev/null
      - name: Strategy PDF
        run: python scripts/build_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: forge-star-outputs
          path: |
            output/FORGE_STAR_Strategy.pdf
            model/results/
            sim/results/

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: ground
        run: docker compose config -q
      - name: Build service images
        working-directory: ground
        run: docker compose build ingest simulator sandf gateway
