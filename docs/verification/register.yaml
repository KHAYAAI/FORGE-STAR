    claim: "ITU NGSO filings: bring into use within 7 years, then deploy 10% / 50% / 100% within 2 / 5 / 7 years (Resolution 35)."
    used_in: [readiness/readiness.yaml S4, S8]
    status: web-checked
    finding: >-
      Resolution 35 (WRC-19, revised WRC-23) milestones 10/50/100% at 2/5/7 years after the end of the
      bring-into-use period. Missing M1 caps the filing at 10× deployed; M2 at 2×. Check the consolidated RR text.
    sources:
      - https://www.itu.int/hub/2020/01/itu-members-agree-to-new-milestones-for-non-geostationary-satellite-deployment/
      - "https://www.itu.int/en/ITU-R/seminars/wrs/Documents/2024/Space-Workshops/Resolution 8 and 35.pdf"
