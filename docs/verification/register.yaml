claims:
  - id: R1
    area: regulatory
    claim: "ICASA requires 30% historically-disadvantaged-group (HDG) equity in ECNS/ECS licensees, which blocks Starlink."
    used_in: [docs/strategy.md §01, model/assumptions.yaml ownership]
    status: web-checked
    finding: >-
      Starlink still had no ICASA licence in mid/late 2026. ICASA says equity-equivalent programmes need an
      amendment to the Electronic Communications Act; no amendment confirmed as enacted.
    sources:
      - https://www.advanced-television.com/2026/05/14/icasa-says-stouh-africa-needs-new-legislation-for-starlink/
      - https://furtherafrica.com/2026/08/27/starlink-south-africa-edges-closer-to-a-licence/
      - https://www.newsroom.co.za/starlink-blocked-by-icasa-equity-rules-in-south-africa/
    confirm_by: "Spectrum / telecoms counsel"
  - id: R2
    area: regulatory
    claim: "Equity-equivalent investment programmes (EEIP) could let foreign operators in without 30% HDG equity."
    used_in: [docs/strategy.md §12 risks]
    status: web-checked
    finding: >-
      Ministerial policy direction (Dec 2025) recognises EEIPs. The minister said in 2026 that legislative
      amendments would be pursued. SpaceX has pledged ~R2bn local investment. This is the main threat to the moat: watch it.
    sources:
      - https://www.techinafrica.com/is-starlink-legal-south-africa-icasa-rules-licensing-2026/
      - https://www.advanced-television.com/2026/05/14/icasa-says-stouh-africa-needs-new-legislation-for-starlink/
    confirm_by: "Spectrum / telecoms counsel"
